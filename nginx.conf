server {
    listen 80;
    server_name _;

    # Directorio raíz con los archivos estáticos del SPA
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy HTTP → Backend (FastAPI) ────────────────────────────────────────
    # Todas las peticiones /api/* se reenvían al contenedor backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para endpoints lentos (reports, AI, GLPI)
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── Proxy WebSocket → Backend ─────────────────────────────────────────────
    # Necesario para los 7 endpoints /ws/* (tráfico, alertas, CrowdSec, Suricata)
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Headers obligatorios para el upgrade HTTP → WebSocket
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Sin timeout de read para conexiones WebSocket de larga duración
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── SPA Fallback ──────────────────────────────────────────────────────────
    # React Router maneja el enrutamiento en cliente.
    # Cualquier ruta no encontrada como archivo estático devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache agresivo para assets hasheados ──────────────────────────────────
    # Vite genera nombres con hash (index-AbCdEf.js), seguros para cachear 1 año
    location /assets/ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    # ── Compresión gzip ───────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
